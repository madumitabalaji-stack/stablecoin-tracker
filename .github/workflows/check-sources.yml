name: Monthly Source Check

on:
  schedule:
    - cron: '0 9 1 * *'   # 1st of each month at 9am UTC
  workflow_dispatch:        # Also runnable manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pypdf

      - name: Run source check
        id: check
        run: python scripts/check-sources.py
        continue-on-error: true

      - name: Open or update the rolling review issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('change-report.json', 'utf8'));
            const lines = report.changed
              .map(c => `- **${c.name}**: [${c.url}](${c.url})`)
              .join('\n');
            const body = [
              '## Primary sources changed',
              '',
              `Last check: **${report.date}** — ${report.changed.length} source(s) moved`,
              'meaningfully since their baseline. Review each against the current card',
              'text in `data/states.json` and update `detail`, `effective`,',
              '`lastVerified`, and any affected fields if the law has changed.',
              '',
              lines,
              '',
              '---',
              '_Generated by the [monthly source check](.github/workflows/check-sources.yml).',
              'This is a single rolling issue: it is reused each run and reopens fresh',
              'only after you close it (i.e. once you have reviewed the changes)._'
            ].join('\n');
            const title = 'Source update detected — needs review';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'needs-review', per_page: 100
            });
            const existing = open.data.find(i => i.title.startsWith('Source update detected'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Re-checked ${report.date}: ${report.changed.length} source(s) flagged. Details updated above.`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['needs-review']
              });
            }

      - name: Commit updated hashes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/source-hashes.json
          git diff --staged --quiet || git commit -m "chore: update source hashes [$(date -u +%Y-%m-%d)]"
          git push
